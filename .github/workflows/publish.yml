name: Legacy SportzPage manual upload

# Production publishing is owned by baseball-production.yml. Keep this legacy
# SportzPage-only uploader available for an explicit emergency/manual run, but
# never let a repository push or timer overwrite generated production HTML.
on: workflow_dispatch

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Upload the main website
      if: github.event_name == 'push'
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: us-east-1
        AWS_S3_WEBSITE_BUCKET: ${{ secrets.AWS_S3_WEBSITE_BUCKET }}
      run: |
        # The committed SportzPage is uploaded separately below.
        aws s3 sync "$GITHUB_WORKSPACE" \
          "s3://$AWS_S3_WEBSITE_BUCKET" \
          --acl public-read \
          --follow-symlinks \
          --delete \
          --exclude ".git/*" \
          --exclude ".github/*" \
          --exclude "sportzpage/*"

    - name: Upload the daily sports page
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: us-east-1
        AWS_S3_WEBSITE_BUCKET: ${{ secrets.AWS_S3_WEBSITE_BUCKET }}
      run: |
        aws s3 sync "$GITHUB_WORKSPACE/sportzpage" \
          "s3://$AWS_S3_WEBSITE_BUCKET/sportzpage" \
          --acl public-read \
          --delete

    - name: Invalidate CloudFront cache
      continue-on-error: true
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: us-east-1
        AWS_CF_DISTRIBUTION_ID: ${{ secrets.AWS_CF_DISTRIBUTION_ID }}
      run: |
        if [ -z "$AWS_CF_DISTRIBUTION_ID" ]; then
          echo "AWS_CF_DISTRIBUTION_ID not set"
          exit 1
        fi

        aws cloudfront create-invalidation \
          --distribution-id "$AWS_CF_DISTRIBUTION_ID" \
          --paths "/sportzpage/*" "/*" || echo "CloudFront invalidation failed (non-blocking)."
