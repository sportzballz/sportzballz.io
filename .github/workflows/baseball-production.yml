name: Baseball production

on:
  workflow_dispatch:
    inputs:
      purge_lede_cache:
        description: "Regenerate all ledes for today instead of restoring the daily cache"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: baseball-production
  cancel-in-progress: false

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: America/New_York
    steps:
      - name: Check out current live-site source
        uses: actions/checkout@v4
        with:
          path: live-site
      - name: Check out baseball platform
        uses: actions/checkout@v4
        with:
          repository: sportzballz/sportzballz-platform
          ssh-key: ${{ secrets.PLATFORM_DEPLOY_KEY }}
          path: platform
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: platform/apps/baseball-llm/src/requirements.txt
      - run: python -m pip install -r platform/apps/baseball-llm/src/requirements.txt
      - id: date
        run: echo "today=$(TZ=America/New_York date +%F)" >> "$GITHUB_OUTPUT"
      - name: Restore today's generated ledes
        uses: actions/cache/restore@v4
        with:
          path: platform/build/lede-cache
          key: baseball-production-ledes-${{ steps.date.outputs.today }}-${{ github.run_id }}
          restore-keys: |
            baseball-production-ledes-${{ steps.date.outputs.today }}-
      - name: Seed cache from current production
        env:
          TODAY: ${{ steps.date.outputs.today }}
        run: |
          mkdir -p platform/build/lede-cache
          test -s "platform/build/lede-cache/$TODAY.json" || cp "live-site/data/lede-cache/$TODAY.json" "platform/build/lede-cache/$TODAY.json" || true
      - name: Purge today's generated ledes
        if: github.event_name == 'workflow_dispatch' && inputs.purge_lede_cache
        env:
          TODAY: ${{ steps.date.outputs.today }}
        run: rm -f "platform/build/lede-cache/$TODAY.json"
      - name: Generate production site
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ENABLE_COMMENTARY_MASSAGE: "true"
          CACHED_MATCHUP_METRICS_ONLY: "true"
          CACHED_METRICS_WEIGHT: "10.0"
        working-directory: platform
        run: >-
          python scripts/run_shadow.py
          --date "${{ steps.date.outputs.today }}"
          --source-site ../live-site
          --site build/production-site
          --cache build/lede-cache
      - name: Validate generated site
        working-directory: platform
        run: >-
          python scripts/compare_shadow.py
          --site build/production-site
          --date "${{ steps.date.outputs.today }}"
          --output build/comparison.md
      - name: Save today's generated ledes
        if: always()
        uses: actions/cache/save@v4
        with:
          path: platform/build/lede-cache
          key: baseball-production-ledes-${{ steps.date.outputs.today }}-${{ github.run_id }}
      - name: Validate AWS deployment access
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          AWS_S3_WEBSITE_BUCKET: ${{ secrets.AWS_S3_WEBSITE_BUCKET }}
        run: |
          test -n "$AWS_ACCESS_KEY_ID"
          test -n "$AWS_SECRET_ACCESS_KEY"
          test -n "$AWS_S3_WEBSITE_BUCKET"
          aws sts get-caller-identity >/dev/null
          aws s3api head-bucket --bucket "$AWS_S3_WEBSITE_BUCKET"
      - name: Publish generated site to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          AWS_S3_WEBSITE_BUCKET: ${{ secrets.AWS_S3_WEBSITE_BUCKET }}
        run: |
          aws s3 sync platform/build/production-site "s3://$AWS_S3_WEBSITE_BUCKET" \
            --acl public-read \
            --follow-symlinks \
            --delete \
            --exclude ".git/*" \
            --exclude ".github/*"
      - name: Invalidate CloudFront cache
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          AWS_CF_DISTRIBUTION_ID: ${{ secrets.AWS_CF_DISTRIBUTION_ID }}
        run: |
          test -n "$AWS_CF_DISTRIBUTION_ID"
          aws cloudfront create-invalidation \
            --distribution-id "$AWS_CF_DISTRIBUTION_ID" \
            --paths "/*"
      - name: Upload production validation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseball-production-${{ steps.date.outputs.today }}
          path: |
            platform/build/comparison.md
            platform/build/lede-cache/${{ steps.date.outputs.today }}.json
            platform/build/production-site/${{ steps.date.outputs.today }}.html
            platform/build/production-site/${{ steps.date.outputs.today }}-plus-money.html
            platform/build/production-site/${{ steps.date.outputs.today }}-run-totals.html
            platform/build/production-site/index.html
            platform/build/production-site/dashboard.html
          retention-days: 14
          if-no-files-found: warn
