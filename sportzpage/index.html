<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>The Daily Sports Page</title>
  <meta name="robots" content="noindex,follow">
  <link rel="canonical" href="https://thedailysportspage.com/">
  <meta http-equiv="refresh" content="0;url=https://thedailysportspage.com/">
  <script>
    (() => {
      const destination = new URL("https://thedailysportspage.com/");
      destination.search = window.location.search;
      destination.hash = window.location.hash;
      window.location.replace(destination.href);
    })();
  </script>
</head>
<body>
  <p>The Daily Sports Page has moved to
    <a href="https://thedailysportspage.com/">thedailysportspage.com</a>.
  </p>
</body>
</html>
