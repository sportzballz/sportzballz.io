ientHeight-3300*scale)/2;paint()}function zoom(n,cx=v.clientWidth/2,cy=v.clientHeight/2){x=cx-(cx-x)*n;y=cy-(cy-y)*n;scale*=n;paint()}v.addEventListener('pointerdown',e=>{drag=true;sx=e.clientX;sy=e.clientY;ox=x;oy=y;v.classList.add('dragging');v.setPointerCapture(e.pointerId)});v.addEventListener('pointermove',e=>{if(drag){x=ox+e.clientX-sx;y=oy+e.clientY-sy;paint()}});v.addEventListener('pointerup',()=>{drag=false;v.classList.remove('dragging')});v.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY<0?1.12:.89,e.clientX,e.clientY-48)},{passive:false});document.querySelectorAll('[data-zoom]').forEach(b=>b.onclick=()=>setZoom(+b.dataset.zoom));document.getElementById('reset').onclick=fit;window.addEventListener('resize',fit);fit()})();</script></body></html>
